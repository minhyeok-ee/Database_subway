<!DOCTYPE html>
<html>
  <body>
    <h1>저장된 나의 노선</h1>
    <a href="/">홈으로</a>
    <br /><br />

    <table border="1" cellpadding="6">
      <tr>
        <th>ID</th>
        <th>이름</th>
        <th>출발</th>
        <th>도착</th>
        <th>경로</th>
        <th>삭제</th>
      </tr>

      {% for item in items %}
      <tr>
        <td>{{ item["id"] }}</td>
        <td>{{ item["route_name"] }}</td>
        <td>{{ item["start_name"] }}</td>
        <td>{{ item["end_name"] }}</td>
        <td>{{ item["path"] }}</td>
        <td><a href="/delete/{{ item['id'] }}/">삭제</a></td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
